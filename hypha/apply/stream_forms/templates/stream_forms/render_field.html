{% load i18n %}
{% if include_question %}
    <section class="">
        <h2 class="pb-1 mb-2 font-medium border-b text-h3 border-base-300 question">
            {{ value.field_label }}
            {% if show_pii_marker %}
                <span class="text-sm text-fg-muted" data-tippy-content="{% trans 'Contains personal information.' %}">{% trans "(PII)" %}</span>
            {% endif %}
        </h2>
{% endif %}

<div class="max-w-full answer prose">
    {% block data_display %}<p>{{ data }}</p>{% endblock %}
</div>

{% if include_question %}
    </section>
{% endif %}
